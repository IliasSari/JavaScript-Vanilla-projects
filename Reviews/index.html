<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Started</title>
</head>
<body>
    <main>
        <section class="container">
            <div class="title">
                <h2>Our reviews</h2>
                <div class="underline"></div>
            </div>
            <article class="review">
                <div class="img-container">
                    <img src="person1.jpg" id="person-img"  alt="">
                </div>
                <h4 id="author">James</h4>
                <p id="job">UI/UX Designer</p>
                <p id="info">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quaerat qui odio delectus recusandae, sequi magnam neque dolores perspiciatis tenetur quae laborum error facere, suscipit nam fugit incidunt debitis rerum repellendus.        
                </p>
                <div class="button-container">
                    <button class="prevbtn">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button class="nextbtn">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button class="randombtn">Suprise me</button>
                </div>
            </article>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
